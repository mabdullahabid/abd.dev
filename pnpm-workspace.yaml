packages: []

allowBuilds:
  canvas: true
  core-js: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true

enablePrePostScripts: true

minimumReleaseAge: 1440
# Refuse package versions whose publisher trust got weaker than earlier ones
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

minimumReleaseAgeExclude:
  - '@fisch0920/config'
  - lqip-modern
  - react-notion-x
  - notion-client
  - notion-types
  - notion-utils
