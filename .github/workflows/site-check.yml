name: Site check

on:
  schedule:
    # 10:00 UTC = 3am in Vancouver (PDT)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test message to Google Chat even if everything passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check production site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/check-site.mjs
        env:
          SITE_URL: https://abd.dev
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ALERT: ${{ inputs.test_alert }}
